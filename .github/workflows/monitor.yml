name: Monitor

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: github-devops-monitor-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Go code
        run: |
          test -z "$(gofmt -l main.go main_test.go)"
          go vet ./...
          go test ./...
          go build -o /tmp/github-devops-monitor .
      - name: Collect GitHub metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/github-devops-monitor
      - name: Commit snapshot
        run: |
          git config user.name 'K40N45H1Q'
          git config user.email '117922182+K40N45H1Q@users.noreply.github.com'
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "data: record GitHub metrics (${GITHUB_RUN_ID}) [automated]"
            git push origin HEAD:main
          fi
